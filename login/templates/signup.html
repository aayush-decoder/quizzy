{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,height=device-height, initial-scale=1.0">
    <title>Sign up Page</title>
    <link rel="stylesheet" href="{% static "login.css" %}">
</head>
<body>
    <div class ="navbar">
        <a href="{%url 'login' %}"><button>Login</button></a>
        <a href="{% url 'home' %}"><button>Home</button></a>
    <!-- Navbar ke andar add kar -->
<select id="themeSwitcher" style="padding: 5px; border-radius: 5px;">
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>
  
    </div>
    <div class="login-form">
        <div class="login-form-header">
            <h2>User Sign Up</h2>
        <form method = "POST">
            {% csrf_token %}
            <input type="email" placeholder="Email" name="email"><br>
            <input type="text" placeholder="Username" name="username"><br>
            <input type="password" placeholder="Password" name="password"><br>
            <input type="password" placeholder="Confirm Password" name="confirm_password"><br>
            {% if error_message %}
                <p style="color: red;">{{ error_message }}</p>
            {% endif %}
            <input type="submit" value="Submit"><br>
            <input type="reset" value="Reset"><br>
        </form>
    </div>
        <div class="login-form-footer">
            <p>Welcome to the Quiz App! Please Sign Up to continue.</p>
        </div>
    </div>
</body>
<script>
    // Theme switcher script
    const themeSwitcher = document.getElementById('themeSwitcher');
    const savedTheme = localStorage.getItem('theme') || 'light';
  
    document.body.classList.add(`${savedTheme}-theme`);
    themeSwitcher.value = savedTheme;
  
    themeSwitcher.addEventListener('change', function() {
      document.body.classList.remove('light-theme', 'dark-theme');
      document.body.classList.add(`${this.value}-theme`);
      localStorage.setItem('theme', this.value);
    });
  </script>
  
</html>
