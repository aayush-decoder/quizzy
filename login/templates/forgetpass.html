{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,height=device-height, initial-scale=1.0">
    <title>Forget Password</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>
    <!-- <div class ="navbar">
        <a href="register.html"><button>Sign Up</button></a>
        <a herf="./home.html"><button>Home</button></a> -->
    </div>
    <div class ="navbar">
        <a href="{%url 'login' %}"><button>Back</button></a>
        <a href="{% url 'home' %}"><button>Home</button></a>
    <!-- Navbar ke andar add kar -->
        <select id="themeSwitcher" style="padding: 5px; border-radius: 5px;">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>
    </div>
    <div class="login-form">
        <div class="login-form-header">
            <h2>Forget Password</h2>
        <form method = "POST">
            {% csrf_token %}
            <input type="text" placeholder="Username" name="username" required><br>
            <input type="submit" value="Send Reset Link"><br>
            <input type="reset" value="Reset"><br>
        </form>
        </div>
        <div class="login-form-footer">
            <p>Welcome to the Quiz App! Please enter your username to reset your password.</p>
        </div>
    </div>
</body>
<script>
    const themeSwitcher = document.getElementById('themeSwitcher');
    const savedTheme = localStorage.getItem('theme') || 'light';
  
    document.body.classList.add(`${savedTheme}-theme`);
    themeSwitcher.value = savedTheme;
  
    themeSwitcher.addEventListener('change', function() {
      document.body.classList.remove('light-theme', 'dark-theme');
      document.body.classList.add(`${this.value}-theme`);
      localStorage.setItem('theme', this.value);
    });
  </script>
  
{% comment %} <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> {% endcomment %}
</html>
