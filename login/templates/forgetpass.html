{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,height=device-height, initial-scale=1.0">
    <title>Forget Password</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>
    <!-- <div class ="navbar">
        <a href="register.html"><button>Sign Up</button></a>
        <a herf="./home.html"><button>Home</button></a> -->
    </div>
    <div class ="navbar">
        <a href="{%url 'login' %}"><button>Back</button></a>
        <a href="{% url 'home' %}"><button>Home</button></a>
    </div>
    <header>
        <h1>Forget Page</h1>

    </header>
    <div class="login-form">
        <form method = "POST">
            {% csrf_token %}
            <input type="username" placeholder="username" name="username" required><br>
            <input type="submit" value="Send Reset Link"><br>
            <input type="reset" value="Reset"><br>
        </form>
        {% if error_message %}
            <p style="color:red;">{{ error_message }}</p>
        {% endif %}
        {% if success_message %}
            <p style="color:green;">{{ success_message }}</p>
        {% endif %}
    </div>
</body>
</html>
