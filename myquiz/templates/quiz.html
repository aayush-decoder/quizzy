{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{{ quiz_name|capfirst }} Quiz</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static "quiz.css" %}">
</head>
<body>
    <section>
       
            <div class="quiz-box" id="quizBox">
                <meter id="progressBar" value="1" min="0" max="10"></meter>
                <div class="question-box">
                    hello
                </div>
                <div class="options-box">
                    <div class="option" id="op1" onclick="optionSelected(this.id);">op1</div>
                    <div class="option" id="op2" onclick="optionSelected(this.id);">op2</div>
                    <div class="option" id="op3" onclick="optionSelected(this.id);">op3</div>
                    <div class="option" id="op4" onclick="optionSelected(this.id);">op4</div>
                </div>
                <button class="btn Btn next-btn" onclick="nextQuestion()">Next</button>
            </div>
        
    </section>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    let startTime = Date.now();
// to be changed when start btn is clicked
        let questions = [];
        let response = {};
        let questionNumber = 1;
        let currentQuestionIndex = 0;

        const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

        $(".quiz-box").addClass("animated-entry")

        
        // loading qsns from json file
        fetch("{% static 'questions/data.json' %}")
          .then(res => res.json())
          .then(data => {
              questions = data['{{ quiz_name }}'];
              displayQuestion(); 
          });
        
       

          document.addEventListener('DOMContentLoaded', function () {
            if ('{{request.user.username}}' == '') {
                Swal.fire({
                    title: '{{ quiz_name|capfirst }} quiz',
                    text: 'You must Sign Up or Log In to give this quiz.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Sign Up',
                    cancelButtonText: 'Log In',
                    allowOutsideClick: false,
                    allowEscapeKey: false,
                    backdrop: `
                    rgba(0, 0, 0, 0.4)
                    url('') 
                    left top 
                    no-repeat
                `,
                    willOpen: () => {
                        var mainBody = document.getElementById("quizBox");
                        mainBody.style.filter = 'blur(5px)';
                    },
                    buttonsStyling: true,
                    confirmButtonColor: '#6a11cb', 
                    cancelButtonColor: '#2575fc', 
                    customClass: {
                      popup: 'sweetalert-custom'
                    }
                  }).then((result) => {
                    if (result.isConfirmed) {
                      window.location.href = '{% url "signup" %}'; 
                    } else if (result.dismiss === Swal.DismissReason.cancel) {
                      window.location.href = '{% url "login" %}'; 
                    }
                  });
              }
        });



       
       
          function displayQuestion() {
            const q = questions[currentQuestionIndex];
        
            $(".question-box").html(q.question);
        
            for (let i = 1; i <= 4; i++) {
                $("#op" + i).html(q["option" + i]);
            }
        
            $('.option').removeClass("selected-option");
        }
        
        function optionSelected(optionId) {
            $('.option').removeClass("selected-option");
            $('#' + optionId).addClass("selected-option");
        
            response['que' + (currentQuestionIndex + 1)] = parseInt(optionId.slice(2));
            console.log(response);
        }
        
        function nextQuestion() {
            currentQuestionIndex++;
        
            if (currentQuestionIndex === questions.length) {
                showScore();
                return;
            }
        
            displayQuestion();
        
            $('.next-btn').text(currentQuestionIndex === questions.length - 1 ? "Finish" : "Next");
        }
        
        function showScore() {
            let score = 0;
        
            for (let i = 0; i < questions.length; i++) {
                const correct = questions[i].key;
                const selected = response['que' + (i + 1)];
                if (correct === selected) score++;
            }
        
            const endTime = Date.now();
            const timeTakenSeconds = ((endTime - startTime) / 1000).toFixed(2);
        
            const percentage = (score / questions.length) * 100;
            const userName = prompt("Enter your name:");
            // const userName = "{{ request.user.username }}";
            const quizName = '{{ quiz_name }}';
        
            // Save to database
            /*let data = new URLSearchParams();
            data.append('user_name', 'John Doe');
            data.append('quiz_name', 'GK');
            data.append('score', 4);
            data.append('time_taken', 23.5);

            fetch('/quiz/save-result/', {
                method: 'POST',
                body: data
            })
            .then(res => res.json())
            .then(result => console.log(result))
            .catch(err => console.error("Error saving:", err));*/

            $.post("/quiz/save-result/", {
                user_name: userName,
                quiz_name: quizName,
                score: score,
                time_taken: timeTakenSeconds,
                csrfmiddlewaretoken: '{{ csrf_token }}'
            }).done(function(responses) {
                console.log("Saved to DB:", responses);
            });


        
            let resultHTML = `
            <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


            <div class="result-box p-4 rounded-4 shadow-lg bg-white text-center" style="max-width: 500px; margin: auto;">
                <h2 class="gradient-text mb-6"><i class="fa-solid fa-trophy"></i> Quiz Completed!</h2>
                <div class="mb-3">
                    <p class="mb-1"><i class="fas fa-user"></i> <strong>${userName}</strong></p>
                    <p class="mb-1"><i class="fas fa-star"></i> You scored <strong>${score} </strong> out of ${questions.length}</p>
                    <div class="circular-progress">
                        <div class="inner-circle">
                            <span class="progress-value">0%</span>
                        </div>
                    </div>
                    <p class="mb-1"><i class="fas fa-clock"></i> Time Taken: <strong>${timeTakenSeconds}s</strong></p>
                  
                </div>
                {% include "star_rating.html" %}`

                + `t>
                
                <div class="d-flex flex-column gap-2 mt-4">
                    <div>
                        <a href="{% url "leaderboard" quiz_name %}"><button class="btn btn-gradient text-white"><i class="fas fa-list-ol"></i> See Leaderboard</button></a>
                        <button class="btn btn-gradient text-white"><i class="fas fa-check-circle"></i> See Answers</button>
                    </div>
                    <button class="btn btn-gradient text-white"><i class="fas fa-chart-line"></i> See Full Analysis</button>
                </div>
            </div>
`;
$(".quiz-box").html(resultHTML);


            
let percentage2 = (score / questions.length) * 100;
let circularProgress = document.querySelector(".circular-progress");
let progressValue = document.querySelector(".progress-value");

let progressStartValue = 0;
let speed = 20; // smaller = faster animation

let progress = setInterval(() => {
    progressStartValue++;

    progressValue.textContent = `${progressStartValue}%`;
    circularProgress.style.background = `conic-gradient(
    violet 0deg,
    rgb(81, 21, 247) ${(progressStartValue * 3.6)}deg,
    rgb(240, 234, 234) ${progressStartValue * 3.6}deg
)`;



    if(progressStartValue >= Math.round(percentage2)) {
        clearInterval(progress);
    }
}, speed);




        
            if (percentage > 40) {
                // baad me karunga
            }
        }

        
        
  
        
        
        
    
</script>
        


</body>
</html>
