{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static "quiz.css" %}">
</head>
<body>
    <section>
       
            <div class="quiz-box">
                <div class="question-box">
                    hello
                </div>
                <div class="options-box">
                    <div class="option" id="op1" onclick="optionSelected(this.id);">op1</div>
                    <div class="option" id="op2" onclick="optionSelected(this.id);">op2</div>
                    <div class="option" id="op3" onclick="optionSelected(this.id);">op3</div>
                    <div class="option" id="op4" onclick="optionSelected(this.id);">op4</div>
                </div>
                <button class="btn next-btn" onclick="nextQuestion()">Next</button>
            </div>
        
    </section>

<script>
    let startTime = Date.now();
// to be changed when start btn is clicked
        let questions = [];
        let response = {};
        let questionNumber = 1;
        let currentQuestionIndex = 0;

        const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

        $(".quiz-box").addClass("animated-entry")

        
        // loading qsns from json file
        fetch("{% static 'questions/data.json' %}")
          .then(res => res.json())
          .then(data => {
              questions = data['{{ quiz_name }}'];
              displayQuestion(); 
          });
        
        function displayQuestion() {
            const q = questions[currentQuestionIndex];
        
            $(".question-box").html(q.question);
        
            for (let i = 1; i <= 4; i++) {
                $("#op" + i).html(q["option" + i]);
            }
        
            $('.option').removeClass("selected-option");
        }
        
        function optionSelected(optionId) {
            $('.option').removeClass("selected-option");
            $('#' + optionId).addClass("selected-option");
        
            response['que' + (currentQuestionIndex + 1)] = parseInt(optionId.slice(2));
            console.log(response);
        }
        
        function nextQuestion() {
            currentQuestionIndex++;
        
            if (currentQuestionIndex === questions.length) {
                showScore();
                return;
            }
        
            displayQuestion();
        
            $('.next-btn').text(currentQuestionIndex === questions.length - 1 ? "Finish" : "Next");
        }
        
        function showScore() {
            let score = 0;
        
            for (let i = 0; i < questions.length; i++) {
                const correct = questions[i].key;
                const selected = response['que' + (i + 1)];
                if (correct === selected) score++;
            }
        
            const endTime = Date.now();
            const timeTakenSeconds = ((endTime - startTime) / 1000).toFixed(2);
        
            const percentage = (score / questions.length) * 100;
            const userName = prompt("Enter your name:");
            // const userName = "{{ request.user.username }}";
            const quizName = "GK";
        
            // Save to database
            /*let data = new URLSearchParams();
            data.append('user_name', 'John Doe');
            data.append('quiz_name', 'GK');
            data.append('score', 4);
            data.append('time_taken', 23.5);

            fetch('/quiz/save-result/', {
                method: 'POST',
                body: data
            })
            .then(res => res.json())
            .then(result => console.log(result))
            .catch(err => console.error("Error saving:", err));*/

            $.post("/quiz/save-result/", {
                user_name: userName,
                quiz_name: quizName,
                score: score,
                time_taken: timeTakenSeconds,
                csrfmiddlewaretoken: '{{ csrf_token }}'
            }).done(function(response) {
                console.log("Saved to DB:", response);
            });


        
            let resultHTML = `
                <div class="result-box">
                    <h2 class="gradient-color">🎉 Quiz Completed!</h2>
                    <p>Name: <strong>${userName}</strong></p>
                    <p>Score: <strong>${score} / ${questions.length}</strong></p>
                    <p>Time Taken: <strong>${timeTakenSeconds}s</strong></p>
                    <p>Percentage: ${percentage.toFixed(1)}%</p>
                </div>
            `;
            $(".quiz-box").html(resultHTML);
        
            if (percentage > 40) {
                // baad me karunga
            }
        }
        
       
        
    
</script>
        


</body>
</html>
