{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static "quiz.css" %}">
</head>
<body>
    <section>
        <div class="quiz-container">
            <div class="quiz-box">
                <div class="question-box">
                    hello
                </div>
                <div class="options-box">
                    <div class="option" id="op1" onclick="optionSelected(this.id);">op1</div>
                    <div class="option" id="op2" onclick="optionSelected(this.id);">op2</div>
                    <div class="option" id="op3" onclick="optionSelected(this.id);">op3</div>
                    <div class="option" id="op4" onclick="optionSelected(this.id);">op4</div>
                </div>
                <button class="btn next-btn" onclick="nextQuestion()">Next</button>
            </div>
        </div>
    </section>

<script>
        let questions = [];
        let response = {};
        let questionNumber = 1;
        let currentQuestionIndex = 0;
        
        // loading qsns from json file
        fetch("{% static 'questions/data.json' %}")
          .then(res => res.json())
          .then(data => {
              questions = data["GK"];
              displayQuestion(); 
          });
        
        function displayQuestion() {
            const q = questions[currentQuestionIndex];
        
            $(".question-box").html(q.question);
        
            for (let i = 1; i <= 4; i++) {
                $("#op" + i).html(q["option" + i]);
            }
        
            $('.option').css({
                'background-color': 'transparent',
                'color': 'black',
                'border-radius': '8px',
                'font-weight': 'normal'
            });
        }
        
        function optionSelected(optionId) {
            $('.option').css({
                'background-color': 'transparent',
                'color': 'black',
                'border-radius': '8px',
                'font-weight': 'normal'
            });
        
            $('#' + optionId).css({
                'background-color': '#4CAF50',
                'color': 'white',
                'border-radius': '8px',
                'font-weight': 'bold'
            });
        
            response['que' + (currentQuestionIndex + 1)] = parseInt(optionId.slice(2));
            console.log(response);
        }
        
        function nextQuestion() {
            currentQuestionIndex++;
        
            if (currentQuestionIndex === questions.length) {
                showScore();
                return;
            }
        
            displayQuestion();
        
            $('.next-btn').text(currentQuestionIndex === questions.length - 1 ? "Finish" : "Next");
        }
        
        function showScore() {
            let score = 0;
        
            for (let i = 0; i < questions.length; i++) {
                const correct = questions[i].key;
                const selected = response['que' + (i + 1)];
                if (correct === selected) score++;
            }
        
            const percentage = (score / questions.length) * 100;
        
            let resultHTML = `
                <div class="result-box">
                    <h2>🎉 Quiz Completed!</h2>
                    <p>Your Score: <strong>${score} / ${questions.length}</strong></p>
                    <p>Percentage: ${percentage.toFixed(1)}%</p>
                </div>
            `;
            // $('.quiz-box').css("display", 'none');
        
            $(".quiz-box").html(resultHTML);
        
            if (percentage > 40) {
                // do something
              }
        }
        
    
</script>
        


</body>
</html>
