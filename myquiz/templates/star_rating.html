<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<div class="col-md-6">
    <div class="rating-card p-4">
        <h5 class="mb-2">Rate this quiz</h5>
        <div class="star-rating animated-stars">
            <input type="radio" id="star5" name="rating" value="5">
            <label for="star5" class="bi bi-star-fill"></label>
            <input type="radio" id="star4" name="rating" value="4">
            <label for="star4" class="bi bi-star-fill"></label>
            <input type="radio" id="star3" name="rating" value="3">
            <label for="star3" class="bi bi-star-fill"></label>
            <input type="radio" id="star2" name="rating" value="2">
            <label for="star2" class="bi bi-star-fill"></label>
            <input type="radio" id="star1" name="rating" value="1">
            <label for="star1" class="bi bi-star-fill"></label>
        </div>
        <p class="text-muted mt-1 rateButton">Click to rate</p>
    </div>
</div>

<style>
    .star-rating {
        direction: rtl;
        display: inline-block;
        cursor: pointer;
    }
    
    .star-rating input {
        display: none;
    }
    
    .star-rating label {
        color: #ddd;
        font-size: 24px;
        padding: 0 2px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    
    .star-rating label:hover,
    .star-rating label:hover~label,
    .star-rating input:checked~label {
        color: #ffc107;
    }

    .submit-rating {
        color:rgb(255, 170, 0);
        cursor: pointer;
        text-shadow: 1px 1px 0 rgba(164, 162, 162, 0.46);
    }
    
    .submit-rating:hover {
        color: rgb(255, 132, 0);
    }

    .submited-rating {
        color: rgb(19, 167, 0);
        text-shadow: 1px 1px 0 rgba(164, 162, 162, 0.46);
    }
</style>

<script>
    document.querySelectorAll('.star-rating:not(.readonly) label').forEach(star => {
        star.addEventListener('click', function() {
            this.style.transform = 'scale(1.2)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 200);
        });
    });

  $(".rating-card input").click(()=> {
    $(".rateButton").html('Submit Rating');
    $(".rateButton").addClass('submit-rating');
    $(".rateButton").removeClass('text-muted');
  })


  $(".rateButton").click(()=> {
    var rating = $('input[name="rating"]:checked').val();

    $.post("/quiz/save-rating/", {
        user_name: '{{ request.user.username }}',
        quiz_name: '{{ quiz_name }}',
        rating: rating,
        csrfmiddlewaretoken: '{{ csrf_token }}'
    }).done(function(responses) {
        $(".rateButton").html('Thanks for rating!');
        $(".rateButton").addClass('submited-rating');
        $(".rateButton").removeClass('submit-rating');
        $(".rating-card h5, .rating-card div").hide();

        console.log("Saved to DB:", responses);
    });
    console.log(rating)
  })




</scrip
